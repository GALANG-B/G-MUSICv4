
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G MUSIC - Music & Lyrics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">G<span>MUSIC</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Explore</a>
      <a href="#">Library</a>
    </nav>
    <button class="profile">G</button>
  </header>

  <main class="container">

    <section class="welcome">
      <p class="tagline">YOUR MUSIC. YOUR UNIVERSE.</p>
      <h1>Feel The <span>Music.</span></h1>
      <p>Listen to your favorite songs and feel every lyric.</p>
    </section>

    <section class="music-layout">

      <div class="player-panel">
        <div class="cover">
          <span>G MUSIC</span>
        </div>

        <h2>Choose Your Song</h2>
        <p class="artist">Unknown Artist</p>

        <div class="progress">
          <div class="progress-fill"></div>
        </div>

        <div class="controls">
          <button>⏮</button>
          <button class="play">▶</button>
          <button>⏭</button>
        </div>
      </div>

      <div class="lyrics-panel">
        <h2>Lyrics <span>LIVE</span></h2>
        <div class="lyrics">
          <p>Lyrics will appear here...</p>
          <p>Your favorite music universe.</p>
          <p>Every beat, every word.</p>
        </div>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
